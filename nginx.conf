upstream controls {
 server cn1:8000 max_fails=1 fail_timeout=5s;
 server cn2:8000 max_fails=1 fail_timeout=5s;
 server cn3:8000 max_fails=1 fail_timeout=5s;
}
server {
 listen 443 ssl;
 ssl_certificate /tls/server.crt;
 ssl_certificate_key /tls/server.key;
 ssl_protocols TLSv1.3;
 client_max_body_size 5m;
 proxy_ssl_certificate /tls/server.crt;
 proxy_ssl_certificate_key /tls/server.key;
 proxy_ssl_trusted_certificate /trust/ca.crt;
 proxy_ssl_verify on;
 proxy_ssl_server_name on;
 proxy_ssl_protocols TLSv1.3;
 proxy_connect_timeout 2s;
 proxy_read_timeout 40s;
 location / {
  proxy_ssl_name control;
  proxy_pass https://controls;
  proxy_next_upstream error timeout http_502 http_503 http_504;
 }
 location /data/dn1/ {
  resolver 127.0.0.11 valid=5s;
  set $target_dn dn1:8000;
  rewrite ^/data/dn1/(.*)$ /$1 break;
  proxy_ssl_name dn1;
  proxy_pass https://$target_dn;
 }
 location /data/dn2/ {
  resolver 127.0.0.11 valid=5s;
  set $target_dn dn2:8000;
  rewrite ^/data/dn2/(.*)$ /$1 break;
  proxy_ssl_name dn2;
  proxy_pass https://$target_dn;
 }
 location /data/dn3/ {
  resolver 127.0.0.11 valid=5s;
  set $target_dn dn3:8000;
  rewrite ^/data/dn3/(.*)$ /$1 break;
  proxy_ssl_name dn3;
  proxy_pass https://$target_dn;
 }
 location /data/dn4/ {
  resolver 127.0.0.11 valid=5s;
  set $target_dn dn4:8000;
  rewrite ^/data/dn4/(.*)$ /$1 break;
  proxy_ssl_name dn4;
  proxy_pass https://$target_dn;
 }
}
