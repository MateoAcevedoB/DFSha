{
  "name": "dfsha5",
  "services": {
    "etcd1": {
      "image": "gcr.io/etcd-development/etcd:v3.5.21",
      "entrypoint": "/usr/local/bin/etcd",
      "environment": {
        "ETCD_NAME": "etcd1",
        "ETCD_DATA_DIR": "/etcd-data",
        "ETCD_LISTEN_CLIENT_URLS": "https://0.0.0.0:2379",
        "ETCD_LISTEN_PEER_URLS": "https://0.0.0.0:2380",
        "ETCD_ADVERTISE_CLIENT_URLS": "https://etcd1:2379",
        "ETCD_INITIAL_ADVERTISE_PEER_URLS": "https://etcd1:2380",
        "ETCD_INITIAL_CLUSTER": "etcd1=https://etcd1:2380,etcd2=https://etcd2:2380,etcd3=https://etcd3:2380",
        "ETCD_INITIAL_CLUSTER_STATE": "new",
        "ETCD_INITIAL_CLUSTER_TOKEN": "dfsha5-secure",
        "ETCD_CERT_FILE": "/tls/server.crt",
        "ETCD_KEY_FILE": "/tls/server.key",
        "ETCD_TRUSTED_CA_FILE": "/trust/ca.crt",
        "ETCD_CLIENT_CERT_AUTH": "true",
        "ETCD_PEER_CERT_FILE": "/tls/server.crt",
        "ETCD_PEER_KEY_FILE": "/tls/server.key",
        "ETCD_PEER_TRUSTED_CA_FILE": "/trust/ca.crt",
        "ETCD_PEER_CLIENT_CERT_AUTH": "true",
        "ETCD_TLS_MIN_VERSION": "TLS1.3"
      },
      "volumes": [
        "./runtime/tls/etcd1:/tls:ro",
        "./runtime/trust:/trust:ro",
        "etcd1:/etcd-data"
      ],
      "networks": [
        "private"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=https://localhost:2379",
          "--cacert=/trust/ca.crt",
          "--cert=/tls/server.crt",
          "--key=/tls/server.key",
          "endpoint",
          "health"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 30
      }
    },
    "etcd2": {
      "image": "gcr.io/etcd-development/etcd:v3.5.21",
